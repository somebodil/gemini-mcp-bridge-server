name: Check

# Types, lint, the tests (with a stdio MCP server passed through) and the build, on Linux, macOS and Windows:
# the server runs commands and touches files, which differs between them.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node scripts/build.mjs
      - run: node scripts/smoke.mjs

  # the bundle on the oldest Node that package.json allows (the tests need a newer one: they run TypeScript)
  oldest-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/build.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/smoke.mjs
