name: Check

# Types, lint, the tests (with a stdio MCP server passed through) and the build, on Linux, macOS and Windows:
# the server runs commands and touches files, which differs between them.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        if: runner.os != 'Windows'
      - run: node scripts/build.mjs
      - run: node dist/cli.js --version
